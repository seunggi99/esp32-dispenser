<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="700" fill="#ffffff"/>

  <!-- title -->
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2328">esp32-dispenser 배선도</text>
  <text x="32" y="68" font-size="13" fill="#656d76">전원 계통은 분리, GND는 공통</text>

  <!-- ===== ESP32 ===== -->
  <rect x="60" y="180" width="200" height="300" rx="8" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/>
  <text x="160" y="208" font-size="16" font-weight="700" fill="#8250df" text-anchor="middle">ESP32-WROOM-32</text>
  <line x1="60" y1="222" x2="260" y2="222" stroke="#d0d7de" stroke-width="1"/>

  <text x="80" y="252" font-size="13" fill="#1f2328">3V3</text>
  <text x="80" y="282" font-size="13" fill="#1f2328">VIN (5V)</text>
  <text x="80" y="312" font-size="13" fill="#1f2328">GND</text>
  <text x="80" y="348" font-size="13" fill="#1f2328">GPIO 21</text>
  <text x="80" y="374" font-size="13" fill="#1f2328">GPIO 22</text>
  <text x="80" y="404" font-size="13" fill="#1f2328">GPIO 16</text>
  <text x="80" y="430" font-size="13" fill="#1f2328">GPIO 4</text>
  <text x="80" y="458" font-size="13" fill="#1f2328">GPIO 26 / 25</text>

  <text x="160" y="500" font-size="12" fill="#656d76" text-anchor="middle">USB ← 노트북 (전원 + 업로드)</text>

  <!-- ===== OLED ===== -->
  <rect x="420" y="150" width="180" height="90" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
  <text x="510" y="178" font-size="15" font-weight="700" fill="#1a7f37" text-anchor="middle">OLED SSD1306</text>
  <text x="510" y="200" font-size="12" fill="#1f2328" text-anchor="middle">VCC · GND · SDA · SCL</text>
  <text x="510" y="222" font-size="11" fill="#656d76" text-anchor="middle">I2C 0x3C · 상태 표시</text>

  <!-- ===== HX711 ===== -->
  <rect x="420" y="290" width="180" height="90" rx="8" fill="#f6f8fa" stroke="#bf8700" stroke-width="2"/>
  <text x="510" y="318" font-size="15" font-weight="700" fill="#bf8700" text-anchor="middle">HX711</text>
  <text x="510" y="340" font-size="12" fill="#1f2328" text-anchor="middle">VCC · GND · DAT · CLK</text>
  <text x="510" y="362" font-size="11" fill="#656d76" text-anchor="middle">24bit ADC · 독립 검증 센서</text>

  <!-- ===== L9110 ===== -->
  <rect x="420" y="430" width="180" height="90" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
  <text x="510" y="458" font-size="15" font-weight="700" fill="#0969da" text-anchor="middle">L9110s</text>
  <text x="510" y="480" font-size="12" fill="#1f2328" text-anchor="middle">VCC · GND · A-IA · A-IB</text>
  <text x="510" y="502" font-size="11" fill="#656d76" text-anchor="middle">모터 드라이버</text>

  <!-- ===== 로드셀 ===== -->
  <rect x="740" y="290" width="170" height="90" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="825" y="318" font-size="15" font-weight="700" fill="#57606a" text-anchor="middle">로드셀 5 kg</text>
  <text x="825" y="340" font-size="12" fill="#1f2328" text-anchor="middle">E+ E- A- A+</text>
  <text x="825" y="362" font-size="11" fill="#656d76" text-anchor="middle">빨강 검정 하양 초록</text>

  <!-- ===== 펌프 ===== -->
  <rect x="740" y="430" width="170" height="90" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="825" y="458" font-size="15" font-weight="700" fill="#57606a" text-anchor="middle">워터펌프 5V</text>
  <text x="825" y="480" font-size="12" fill="#1f2328" text-anchor="middle">MOTOR A 단자</text>
  <text x="825" y="502" font-size="11" fill="#656d76" text-anchor="middle">잠수형 · 80~100 L/H</text>

  <!-- ===== 5V 어댑터 ===== -->
  <rect x="420" y="590" width="180" height="70" rx="8" fill="#fff8f5" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="510" y="616" font-size="15" font-weight="700" fill="#cf222e" text-anchor="middle">5V 어댑터</text>
  <text x="510" y="638" font-size="11" fill="#656d76" text-anchor="middle">별도 전원 · 실패 주입 지점</text>

  <!-- ===== 배선: OLED ===== -->
  <!-- 3V3 -> OLED VCC -->
  <path d="M 260 248 L 340 248 L 340 168 L 420 168" fill="none" stroke="#cf222e" stroke-width="2"/>
  <!-- GND -> OLED GND -->
  <path d="M 260 308 L 320 308 L 320 186 L 420 186" fill="none" stroke="#24292f" stroke-width="2"/>
  <!-- 21 -> SDA -->
  <path d="M 260 344 L 300 344 L 300 204 L 420 204" fill="none" stroke="#8250df" stroke-width="2"/>
  <!-- 22 -> SCL -->
  <path d="M 260 370 L 280 370 L 280 222 L 420 222" fill="none" stroke="#8250df" stroke-width="2"/>

  <!-- ===== 배선: HX711 ===== -->
  <!-- VIN 5V -> HX711 VCC -->
  <path d="M 260 278 L 340 278 L 340 308 L 420 308" fill="none" stroke="#bc4c00" stroke-width="2"/>
  <!-- GND -->
  <path d="M 260 308 L 420 326" fill="none" stroke="#24292f" stroke-width="2"/>
  <!-- 16 -> DAT -->
  <path d="M 260 400 L 340 400 L 340 344 L 420 344" fill="none" stroke="#8250df" stroke-width="2"/>
  <!-- 4 -> CLK -->
  <path d="M 260 426 L 320 426 L 320 362 L 420 362" fill="none" stroke="#8250df" stroke-width="2"/>
  <!-- HX711 -> 로드셀 -->
  <path d="M 600 335 L 740 335" fill="none" stroke="#57606a" stroke-width="2.5"/>
  <text x="670" y="328" font-size="11" fill="#656d76" text-anchor="middle">4선</text>

  <!-- ===== 배선: L9110 ===== -->
  <!-- 26/25 -> A-IA / A-IB -->
  <path d="M 260 454 L 340 454 L 340 466 L 420 466" fill="none" stroke="#8250df" stroke-width="2"/>
  <!-- GND 공통 -->
  <path d="M 260 308 L 290 308 L 290 560 L 640 560 L 640 484 L 600 484" fill="none" stroke="#24292f" stroke-width="2"/>
  <!-- 어댑터 -> L9110 VCC -->
  <path d="M 490 590 L 490 520" fill="none" stroke="#cf222e" stroke-width="2.5"/>
  <!-- 어댑터 GND -> 공통 -->
  <path d="M 540 590 L 540 560" fill="none" stroke="#24292f" stroke-width="2.5"/>
  <!-- L9110 -> 펌프 -->
  <path d="M 600 466 L 740 466" fill="none" stroke="#0969da" stroke-width="2.5"/>
  <text x="670" y="459" font-size="11" fill="#656d76" text-anchor="middle">MOTOR A</text>

  <!-- 공통 GND 라벨 -->
  <circle cx="640" cy="560" r="4" fill="#24292f"/>
  <text x="660" y="580" font-size="12" font-weight="600" fill="#24292f">공통 GND</text>

  <!-- ===== 범례 ===== -->
  <rect x="60" y="590" width="300" height="70" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <line x1="76" y1="612" x2="106" y2="612" stroke="#cf222e" stroke-width="2.5"/>
  <text x="114" y="616" font-size="12" fill="#1f2328">3.3V / 5V 전원</text>
  <line x1="76" y1="632" x2="106" y2="632" stroke="#bc4c00" stroke-width="2.5"/>
  <text x="114" y="636" font-size="12" fill="#1f2328">VIN 5V</text>
  <line x1="226" y1="612" x2="256" y2="612" stroke="#24292f" stroke-width="2.5"/>
  <text x="264" y="616" font-size="12" fill="#1f2328">GND</text>
  <line x1="226" y1="632" x2="256" y2="632" stroke="#8250df" stroke-width="2.5"/>
  <text x="264" y="636" font-size="12" fill="#1f2328">신호선</text>

  <!-- ===== 주석 ===== -->
  <text x="660" y="626" font-size="12" fill="#cf222e" font-weight="600">실험 시 이 어댑터만 분리</text>
  <text x="660" y="646" font-size="11" fill="#656d76">→ ESP32는 정상 동작, 펌프만 정지</text>

  <text x="740" y="180" font-size="12" fill="#656d76">물통 → 펌프 → 튜브 → 컵</text>
  <text x="740" y="200" font-size="12" fill="#656d76">컵은 로드셀 상판 위</text>
  <text x="740" y="220" font-size="12" fill="#656d76">물통은 저울 밖에 배치</text>
</svg>
